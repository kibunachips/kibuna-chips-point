<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIBUNA CHIPS | Admin</title><style>
:root{--gold:#ffd32b;--dark:#111116;--panel:#24242b;--line:#444}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:var(--dark);color:#fff;margin:0}main{max-width:1100px;margin:25px auto;padding:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}h1,h2{color:var(--gold)}button{background:var(--gold);color:#111;border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}button.secondary{background:#ddd}button:disabled{opacity:.5}input,select,textarea{background:#111;color:#fff;border:1px solid #555;border-radius:8px;padding:9px;max-width:100%}a{color:var(--gold)}.muted{color:#ccc}#logout{display:none}#dashboard[hidden]{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{white-space:pre-wrap;color:#ffe7a3}.orders{display:grid;gap:14px}.order{background:#17171c;border:1px solid #484850;border-radius:12px;padding:15px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-top:12px}.fields label{font-size:12px;color:#ccc;display:grid;gap:5px}.detail{line-height:1.6;overflow-wrap:anywhere}.pill{display:inline-block;background:#393329;color:#ffe17a;border-radius:20px;padding:4px 9px;font-size:12px}@media(max-width:500px){main{padding:10px}.panel{padding:14px}}
</style></head><body><main><p><a href="/">← KIBUNA CHIPS</a></p><section class="panel"><h1>🍟 KIBUNA CHIPS Admin</h1><p class="muted">Usimamizi wa oda. Ingia kwa akaunti ya Super Admin iliyoidhinishwa.</p><div class="row"><button id="login">Ingia kwa Google</button><button id="logout" class="secondary">Toka</button><button id="refresh" style="display:none">Sasisha oda</button></div><p id="msg" class="status" role="status"></p><section id="dashboard" hidden><h2>Oda za wateja</h2><p id="identity" class="muted"></p><div id="orders" class="orders"></div></section></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';
import {getFirestore,collection,getDocs,query,orderBy,doc,updateDoc} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyB2seRBrFvyxSsmSdgsDN1Nr35BlqcbvNo',authDomain:'kibuna-chip-s.firebaseapp.com',projectId:'kibuna-chip-s',storageBucket:'kibuna-chip-s.firebasestorage.app',messagingSenderId:'679734115156',appId:'1:679734115156:web:340bf20807eb6c75a926c1',measurementId:'G-D3MNKP595N'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});const adminEmail='kibunaelias2@gmail.com';const $=id=>document.getElementById(id);function message(s){$('msg').textContent=s}function err(e){message('Hitilafu: '+(e?.code||e?.message||'Jaribu tena.'))}getRedirectResult(auth).catch(err);
$('login').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(e.code==='auth/popup-blocked')try{await signInWithRedirect(auth,provider)}catch(x){err(x)}else err(e)}};$('logout').onclick=()=>signOut(auth);$('refresh').onclick=loadOrders;
onAuthStateChanged(auth,async user=>{const allowed=!!user&&user.email?.toLowerCase()===adminEmail&&user.emailVerified===true;if(user&&!allowed){message('Akaunti hii haina ruhusa ya Super Admin.');await signOut(auth);return}$('login').style.display=allowed?'none':'inline-block';$('logout').style.display=allowed?'inline-block':'none';$('refresh').style.display=allowed?'inline-block':'none';$('dashboard').hidden=!allowed;$('identity').textContent=allowed?user.email:'';if(allowed){message('Umeingia. Inapakia oda kutoka Firestore…');await loadOrders()}else if(!user)message('')});
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateText(v){try{return v?.toDate?v.toDate().toLocaleString('sw-TZ'):new Date(v).toLocaleString('sw-TZ')}catch{return '—'}}
async function loadOrders(){if(auth.currentUser?.email?.toLowerCase()!==adminEmail)return;const box=$('orders');box.innerHTML='';message('Inapakia oda…');try{const snap=await getDocs(query(collection(db,'orders'),orderBy('createdAt','desc')));if(snap.empty){box.innerHTML='<div class="order">Bado hakuna oda mpya kwenye Firestore. Oda za zamani zipo Netlify Forms na hazihamishwi moja kwa moja.</div>';message('Hakuna oda kwenye Firestore.');return}for(const d of snap.docs){const o=d.data(),el=document.createElement('article');el.className='order';el.innerHTML=`<div class="row"><strong>${esc(o.orderId||d.id)}</strong><span class="pill">${esc(o.status||'—')}</span></div><div class="detail"><b>Mteja:</b> ${esc(o.customer)} · <b>Simu:</b> ${esc(o.phone)}<br><b>Namna:</b> ${esc(o.fulfillment)} · <b>Eneo:</b> ${esc(o.address)}<br><b>Chips kavu:</b> ${esc(o.chipsKavu)} · <b>Chips mayai:</b> ${esc(o.chipsMayai)}<br><b>Mahitaji ya ziada:</b> ${esc(o.extras)}<br><b>Maelekezo:</b> ${esc(o.notes)}<br><b>Jumla ya chakula:</b> TSh ${Number(o.foodSubtotal||0).toLocaleString('en-US')} · <b>Tarehe:</b> ${esc(dateText(o.createdAt))}</div><div class="fields"><label>Bei ya mwisho (TSh)<input type="number" min="0" step="100" class="quote" value="${o.quoteTotal??''}" placeholder="Weka bei"></label><label>Ada ya delivery (TSh)<input type="number" min="0" step="100" class="delivery" value="${o.deliveryFee??''}" placeholder="Weka ada"></label><label>Hali ya oda<select class="statusSelect"><option>AWAITING QUOTE</option><option>AWAITING PAYMENT</option><option>PREPARING</option><option>READY</option><option>OUT FOR DELIVERY</option><option>DELIVERED</option><option>CANCELLED</option></select></label><label>Malipo<select class="paySelect"><option>NOT PAID</option><option>PAID</option><option>REFUNDED</option></select></label><label>Maelezo ya admin<input class="adminNotes" value="${esc(o.adminNotes||'')}" placeholder="Maelezo"></label></div><p><button class="save">Hifadhi mabadiliko</button> <span class="saveMsg muted"></span></p>`;el.querySelector('.statusSelect').value=o.status||'AWAITING QUOTE';el.querySelector('.paySelect').value=o.paymentStatus||'NOT PAID';el.querySelector('.save').onclick=async()=>{const b=el.querySelector('.save'),m=el.querySelector('.saveMsg');b.disabled=true;m.textContent='Inahifadhi…';try{const quote=el.querySelector('.quote').value,delivery=el.querySelector('.delivery').value;await updateDoc(doc(db,'orders',d.id),{quoteTotal:quote===''?null:Number(quote),deliveryFee:delivery===''?null:Number(delivery),status:el.querySelector('.statusSelect').value,paymentStatus:el.querySelector('.paySelect').value,adminNotes:el.querySelector('.adminNotes').value.trim(),updatedAt:new Date()});m.textContent='Imehifadhiwa.'}catch(e){m.textContent='Imeshindikana: '+(e.code||e.message)}finally{b.disabled=false}};box.appendChild(el)}message('Oda '+snap.size+' zimepatikana.')}catch(e){box.innerHTML='<div class="order">Imeshindikana kusoma oda. Hakikisha Firestore Rules zimechapishwa na UID ni sahihi.</div>';err(e)}}
</script></body></html>
